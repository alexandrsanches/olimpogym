# /etc/nginx/sites-available/dashboard.olimpogym.com.br
# Depois: ln -s ../sites-available/dashboard.olimpogym.com.br /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d dashboard.olimpogym.com.br
server {
    listen 80;
    server_name dashboard.olimpogym.com.br;

    client_max_body_size 12m;   # comprovantes de até 10 MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
