# /etc/apache2/sites-available/dashboard.olimpogym.com.br.conf
# Requer: a2enmod proxy proxy_http headers
# Depois: a2ensite dashboard.olimpogym.com.br && systemctl reload apache2
#         certbot --apache -d dashboard.olimpogym.com.br
<VirtualHost *:80>
    ServerName dashboard.olimpogym.com.br
    LimitRequestBody 12582912
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
